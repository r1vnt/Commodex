[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "commodex"
version = "0.1.0"
description = "Physical and financial commodity quantities and explicit assay conversions"
requires-python = ">=3.11,<3.15"
dependencies = ["pint>=0.25.3,<0.27"]

[project.optional-dependencies]
numerical = ["numpy>=2,<3", "scipy>=1.14,<2"]
thermodynamics = ["pyaga8==0.1.18", "CoolProp==8.1.0"]
data = ["pandas>=2.2,<4", "pyarrow>=18,<24", "pint-pandas>=0.6,<0.8"]
uncertainty = ["uncertainties>=3.2,<4"]
config = ["PyYAML>=6,<7", "pydantic>=2.10,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "pytest-benchmark>=5,<6", "mypy>=1.14,<2", "ruff>=0.9,<1", "build>=1.2,<2", "setuptools>=77,<82", "wheel", "packaging", "tzdata; sys_platform == 'win32'", "pip-audit>=2.9,<3", "radon>=6,<7", "vulture>=2.14,<3", "mutmut>=3,<4; sys_platform != 'win32'"]
all = ["commodex[numerical,thermodynamics,data,uncertainty,config,dev]"]

[tool.setuptools.packages.find]
include = ["core", "core.*"]
namespaces = true

[tool.setuptools.package-data]
"core.units" = ["reference_data/*/*.json", "reference_data/*/*/*.json", "reference_data/*/*/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
norecursedirs = [".git", ".venv", ".hypothesis", "build", "dist", "artifacts"]

[tool.coverage.run]
branch = true
source = ["core.units"]
omit = ["*/test_*.py", "*/_test*.py", "*/_family_contracts.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
